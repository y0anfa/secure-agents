name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  dependencies:
    # The core is meant to have no runtime dependencies. If that changes it
    # should be a decision someone makes, not a line that slips into a PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The core must declare no runtime dependencies
        run: |
          pip install .
          python - <<'PY'
          from importlib.metadata import requires

          # Read the installed distribution's own metadata rather than the
          # environment: every runner ships pip and setuptools, and asking what
          # is installed answers a different question from what we require.
          declared = requires("secure-agents") or []
          core = [r for r in declared if "extra ==" not in r]
          if core:
              raise SystemExit("secure-agents declares runtime dependencies: " + ", ".join(core))
          print(f"core has no runtime dependencies ({len(declared)} optional, all behind extras)")
          PY

  examples:
    # The examples are the first thing a stranger runs. An example that does
    # not run is worse than no example.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: PYTHONPATH=examples python examples/01_quickstart.py
      - run: PYTHONPATH=examples python examples/02_injection.py
