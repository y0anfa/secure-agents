name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  dependencies:
    # The core is meant to have no runtime dependencies. If that changes it
    # should be a decision someone makes, not a line that slips into a PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Core must install with nothing else
        run: |
          pip install .
          pip list --format=freeze --not-required | grep -v '^secure-agents' > extra.txt || true
          if [ -s extra.txt ]; then
            echo "secure-agents pulled in runtime dependencies:"; cat extra.txt; exit 1
          fi

  examples:
    # The examples are the first thing a stranger runs. An example that does
    # not run is worse than no example.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: PYTHONPATH=examples python examples/01_quickstart.py
      - run: PYTHONPATH=examples python examples/02_injection.py
