name: CI

# Actions are pinned to commit SHAs, with the version in a trailing comment.
# See CONTRIBUTING.md for why, and how to update one by hand.

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. A job that needs more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: mypy

  test:
    # macOS matters here beyond the usual: the sandbox's limits are setrlimit
    # calls, so what they do depends on the kernel, and Darwin accepts
    # RLIMIT_AS and then ignores it. That difference is exactly the kind of
    # thing a Linux-only matrix hides, and it is the reason unenforced_limits
    # exists.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -q

  examples:
    # The examples are the security claims the READMEs make. Their tests
    # assert that each attack is actually stopped, so this job failing means
    # the documentation has started lying.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest examples -q
      - name: The quickstart in the README still runs
        run: python examples/quickstart.py

  dependencies:
    # The core claims to have no dependencies. Check it, rather than trusting
    # that nobody added one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Nothing but secure-agents and pip's own machinery
        run: |
          python - <<'PY'
          import importlib.metadata as md
          deps = md.requires("secure-agents") or []
          runtime = [d for d in deps if "extra ==" not in d]
          if runtime:
              raise SystemExit(f"the core gained runtime dependencies: {runtime}")
          print("core is dependency-free")
          PY
