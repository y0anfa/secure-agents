[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-agents"
version = "0.1.0"
description = "A small agent SDK where every tool call passes a policy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "llm", "security", "policy", "sandbox", "prompt-injection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

# The core has no dependencies. That is a feature: this is a library people
# are asked to trust, and every transitive dependency is something they have
# to trust too.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/y0anfa/secure-agents"
Issues = "https://github.com/y0anfa/secure-agents/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_agents"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"examples/*" = ["S"]

[tool.mypy]
python_version = "3.10"
packages = ["secure_agents"]
mypy_path = "src"
warn_unused_ignores = true
