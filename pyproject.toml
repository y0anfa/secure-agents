[build-system]
# PEP 639 license expressions need hatchling 1.27 or newer.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "secure-agents"
version = "0.1.0"
description = "A small agent SDK where every tool call passes a policy."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "llm", "security", "policy", "sandbox", "prompt-injection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]

# The core has no dependencies. That is a feature: this is a library people
# are asked to trust, and every transitive dependency is something they have
# to trust too.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
# The lint toolchain is pinned to a minor range. An unpinned ruff means a
# release with a new rule or a new formatter target turns CI red on a branch
# that changed nothing, which is how contributors learn to ignore CI.
dev = ["pytest>=8", "ruff>=0.16,<0.17", "mypy>=1.11,<2"]

[project.urls]
Homepage = "https://github.com/y0anfa/secure-agents"
Source = "https://github.com/y0anfa/secure-agents"
Issues = "https://github.com/y0anfa/secure-agents/issues"
Changelog = "https://github.com/y0anfa/secure-agents/blob/main/CHANGELOG.md"
Documentation = "https://github.com/y0anfa/secure-agents/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_agents"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.format]
# Ruff formats Python inside Markdown fences. The snippets in README.md and
# docs/API.md are illustrative: they line up trailing comments for reading and
# some of them are deliberately elided, neither of which survives the
# formatter. They are prose, so they are not its business.
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"examples/*" = ["S"]

[tool.mypy]
python_version = "3.10"
packages = ["secure_agents"]
mypy_path = "src"
warn_unused_ignores = true
